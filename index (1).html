<title>Fichas da Ordem</title>
<style>
:root{--bg:#f4f1ee;--sf:#fff;--tx:#1c1a1a;--mu:#6b6560;--bd:#ddd6cf;--ac:#0f5c6b;--pv:#c0392b;--sn:#2e6fb7;--pe:#7a3fa0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#141214;--sf:#1f1c20;--tx:#ece7e3;--mu:#9a928b;--bd:#342f35;--ac:#2d8a99;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--bd);z-index:5}
h1{font-size:19px;margin:0 0 8px;letter-spacing:.02em}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:8px 14px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:12px 14px 40px;max-width:720px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:700;font-size:17px}.sub{color:var(--mu);font-size:13px}
.badge{background:var(--ac);color:#fff;border-radius:99px;font-size:11px;padding:2px 8px;white-space:nowrap}
.bar{margin-top:8px}.bar b{font-size:12px;display:flex;justify-content:space-between;color:var(--mu);font-weight:600}
.trk{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.fil{height:100%}
.det{margin-top:10px;border-top:1px solid var(--bd);padding-top:10px;font-size:14px}
.det h4{margin:10px 0 2px;font-size:12px;text-transform:uppercase;color:var(--mu)}
.det p{margin:0;white-space:pre-wrap}
.att{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.att div{background:var(--bg);border-radius:8px;padding:6px 0}.att span{display:block;font-size:11px;color:var(--mu)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px;text-transform:uppercase}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px}
textarea{min-height:84px;resize:vertical}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g5 input,.g3 input{text-align:center;padding:9px 4px}
#st{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
.pri{margin-top:10px;background:var(--ac);border-color:var(--ac);color:#fff}.clk{cursor:pointer}

select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px}
